# Publiceert de app op GitHub Pages:
# - bij elke wijziging op de main-branch;
# - elke ochtend, met de nieuwste prijzen van Checkjebon.nl;
# - met de hand via de knop "Run workflow" op GitHub.
# De tests moeten slagen; anders wordt er niets gepubliceerd.
name: Publiceren

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 5 * * *' # elke dag 05:17 UTC (07:17 zomertijd), na de update van Checkjebon
  workflow_dispatch:

permissions:
  contents: write # om de nieuwe prijzen terug te zetten in de repository
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  bouwen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Prijzen bijwerken
        if: github.event_name != 'push'
        run: |
          npm run prijzen
          if git diff --quiet -- data/; then
            echo "Geen nieuwe prijzen."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/producten.json data/bron.json
            git commit -m "Prijzen bijgewerkt ($(date +%F))"
            git push
          fi

      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publiceren:
    needs: bouwen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
